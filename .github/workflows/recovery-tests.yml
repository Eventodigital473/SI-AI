name: SI-AI Recovery Tests

on:
  push:
    branches:
      - recovery/restore-upload-zip
    paths:
      - recovered/SI-AI/**
      - .github/workflows/recovery-tests.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recovered/SI-AI
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/restore-upload-zip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: recovered/SI-AI/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q .

      - name: Run test suite
        run: python -m pytest -q
