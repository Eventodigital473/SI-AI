name: Import reviewed SI-AI source bundle

on:
  push:
    branches: [main]
    paths:
      - 'SI-AI_SOURCE_BUNDLE_20261117.tar.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract reviewed source
        run: |
          test -s SI-AI_SOURCE_BUNDLE_20261117.tar.gz.b64
          base64 --decode SI-AI_SOURCE_BUNDLE_20261117.tar.gz.b64 > /tmp/si-ai-source.tar.gz
          tar -tzf /tmp/si-ai-source.tar.gz
          tar -xzf /tmp/si-ai-source.tar.gz -C .
          rm SI-AI_SOURCE_BUNDLE_20261117.tar.gz.b64
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile source and tests
        run: python -m py_compile SI_AI_smc.py si_ai_scanner.py market_universe.py data_sources.py news_risk.py main.py test_*.py
      - name: Run all unit tests
        run: python -m unittest discover -v
      - name: Run corrected SMC baseline
        run: python test_smc_baseline_corrected.py
      - name: Commit source files while preserving the original upload archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Publish reviewed SI-AI Phase C source and tests"
            git push origin HEAD:main
          fi
