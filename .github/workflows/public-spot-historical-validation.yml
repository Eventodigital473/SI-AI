name: SI-AI public Spot historical validation

on:
  push:
    branches:
      - feature/dynamic-coin-universe
    paths:
      - .github/workflows/public-spot-historical-validation.yml
      - recovered/SI-AI/**
  workflow_dispatch:

concurrency:
  group: si-ai-public-history-250bar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  collect-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: recovered/SI-AI
    steps:
      - name: Check out reviewed feature branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: recovered/SI-AI/requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q .
      - name: Run full offline regression suite
        run: python -m pytest -q
      - name: Download dynamic-universe Spot history and run shared-wallet backtest
        run: python run_public_spot_portfolio.py --days 180 --symbol-limit 50
      - name: Upload verified datasets and research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: si-ai-public-spot-history-${{ github.run_number }}
          path: |
            recovered/SI-AI/data/historical/spot/*.json
            recovered/SI-AI/data/reports/*.json
          if-no-files-found: warn
          retention-days: 30
