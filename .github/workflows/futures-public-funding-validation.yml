name: SI-AI Futures exact funding validation

on:
  push:
    paths:
      - "recovered/SI-AI/SI_AI_smc.py"
      - "recovered/SI-AI/backtesting.py"
      - "recovered/SI-AI/historical_data.py"
      - "recovered/SI-AI/historical_backtest.py"
      - "recovered/SI-AI/funding_data.py"
      - "recovered/SI-AI/mark_price_data.py"
      - "recovered/SI-AI/run_public_futures_backtest.py"
      - ".github/workflows/futures-public-funding-validation.yml"
  pull_request:
    branches:
      - integration/si-ai-consolidated-2026-11-18
    paths:
      - "recovered/SI-AI/SI_AI_smc.py"
      - "recovered/SI-AI/backtesting.py"
      - "recovered/SI-AI/historical_data.py"
      - "recovered/SI-AI/historical_backtest.py"
      - "recovered/SI-AI/funding_data.py"
      - "recovered/SI-AI/mark_price_data.py"
      - "recovered/SI-AI/run_public_futures_backtest.py"
      - ".github/workflows/futures-public-funding-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: si-ai-public-funding-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-funding-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: recovered/SI-AI/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
        working-directory: recovered/SI-AI

      - name: Verify dependency consistency
        run: python -m pip check
        working-directory: recovered/SI-AI

      - name: Compile project
        run: python -m compileall -q .
        working-directory: recovered/SI-AI

      - name: Run full automated test suite
        run: python -m pytest -q
        working-directory: recovered/SI-AI

      - name: Run 730-day Binance USD-M Futures backtest with exact settlement funding mark prices
        run: |
          python run_public_futures_backtest.py \
            --days 730 \
            --initial-equity 100 \
            --symbol BTC/USDT \
            --symbol ETH/USDT \
            --symbol BNB/USDT \
            --symbol XRP/USDT \
            --symbol ADA/USDT \
            --symbol DOGE/USDT \
            --symbol LINK/USDT \
            --symbol AVAX/USDT \
            --symbol DOT/USDT \
            --symbol SOL/USDT
        working-directory: recovered/SI-AI

      - name: Preserve funding, mark-price datasets and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: si-ai-public-funding-validation-${{ github.run_id }}
          path: |
            recovered/SI-AI/data/historical/**
            recovered/SI-AI/data/reports/**
          if-no-files-found: warn
          retention-days: 30
